[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autonomous-data-scientist"
version = "0.1.0"
description = "Production-grade autonomous data science platform"
requires-python = ">=3.12"
dependencies = [
  "fastapi[standard]>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "sqlalchemy[asyncio]>=2.0.31",
  "asyncpg>=0.29.0",
  "psycopg[binary]>=3.2.0",
  "alembic>=1.13.0",
  "redis[hiredis]>=5.0.0",
  "boto3>=1.34.0",
  "python-multipart>=0.0.9",
  "orjson>=3.10.0",
  "pandas>=2.2.0",
  "numpy>=1.26.0",
  "scipy>=1.13.0",
  "scikit-learn>=1.5.0",
  "matplotlib>=3.9.0",
  "langchain>=0.2.0",
  "langchain-core>=0.2.0",
  "langchain-openai>=0.1.0",
  "langgraph>=0.2.0",
  "langfuse>=2.0.0",
  "nemoguardrails>=0.10.0",
  "structlog>=24.0.0",
  "python-json-logger>=2.0.0",
  "tenacity>=8.5.0",
  "httpx>=0.27.0",
  "pyarrow>=25.0.1",
  "pytest>=9.1.1",
  "langchain-anthropic>=1.7.2",
  "langchain-nvidia-ai-endpoints>=1.4.3",
  "passlib[bcrypt]>=1.7.4",
  "pyjwt>=2.8.0",
  "email-validator>=2.0.0",
  "langgraph-checkpoint-postgres>=2.0.0",
  "slowapi>=0.1.9",
  "prometheus-client>=0.20.0",
  "opentelemetry-api>=1.25.0",
  "opentelemetry-sdk>=1.25.0",
  "opentelemetry-instrumentation-fastapi>=0.46b0",
  "opentelemetry-instrumentation-sqlalchemy>=0.46b0",
  "opentelemetry-exporter-otlp>=1.25.0",
  "sentry-sdk[fastapi]>=2.0.0",
  "python-magic>=0.4.27",
  "clamd>=1.0.2",
  "libmagic>=1.0",
  "psycopg2>=2.9.13",
  "argon2-cffi>=25.1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.5.0",
  "mypy>=1.10.0",
  "types-redis>=4.6.0",
  "respx>=0.21.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "B",
  "SIM",
  "UP",
  "RUF"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "pytest-asyncio>=1.4.0",
]
